<style>
  /* Layout: una columna de teléfono sobre azul noche. Pista de corredores en la salida, los relevos y la meta. */
  :root {
    --ink: #0B0F1A;        /* fondo */
    --night: #1B2433;      /* superficies: opciones, banda de progreso */
    --slate: #2E3A4F;      /* rellenos tranquilos, carriles */
    --edge: #56647E;       /* borde de controles: 3.2:1 sobre el fondo */
    --mist: #D9DCE3;       /* texto principal: 13.8:1 */
    --haze: #A6ADBD;       /* texto secundario: 8:1 */
    --gold: #B08D57;       /* acento de medalla: elección, botón, tu corredor, meta */
    --gold-hi: #C9A66B;    /* dorado para texto pequeño sobre pizarra */
    --on-gold: #0B0F1A;    /* texto sobre dorado: 6.1:1 */
    --ok: #9FD3B0;
    --bad: #FF9A8F;
    --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 16px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; font-size: 100%; background: var(--ink); accent-color: var(--gold); scrollbar-color: var(--slate) var(--ink); }
  html.big { font-size: 125%; }
  body {
    margin: 0; min-height: 100%; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--ink); color: var(--mist); caret-color: var(--gold);
    font: 400 1.0625rem/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--gold); color: var(--on-gold); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  h1[tabindex="-1"]:focus { outline: none; }
  h1, h2, h3, p, ul, ol { margin: 0; }
  ul { padding: 0; list-style: none; }
  a { color: var(--gold-hi); text-underline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #app { flex: 1; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 34rem; margin-inline: auto; padding-inline: 20px; }
  .stack { display: grid; gap: 12px; }

  /* ───────── Pantallas con pista (salida, relevos, meta) ───────── */
  .field { position: relative; flex: 1; display: flex; flex-direction: column; isolation: isolate; }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 0; z-index: -1; display: block; pointer-events: none; }
  .field-inner { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 14px 22px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
  .wordmark { font: 800 1.2rem/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mist); }
  .wordmark b { color: var(--gold); font-weight: 800; }
  .tool {
    min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 999px;
    border: 1.5px solid var(--edge); background: transparent; color: var(--mist);
    font: 700 1rem/1 var(--body); display: inline-grid; place-items: center;
  }
  .tool[aria-pressed="true"] { background: var(--mist); color: var(--ink); border-color: var(--mist); }
  .tool svg { width: 22px; height: 22px; }
  .headline {
    font: 900 min(19vw, 118px)/1 var(--display); /* 1: las tildes de esta letra son altas y se esconden con menos */ text-transform: uppercase;
    letter-spacing: 0.005em; text-wrap: balance; margin-top: 8px;
  }
  .headline em { font-style: normal; color: var(--gold); }
  .headline.small { font-size: min(13.5vw, 84px); line-height: 1; }
  .lede { font-size: 1.15rem; line-height: 1.45; color: var(--haze); max-width: 34ch; }
  .track-space { flex: 1 0 clamp(120px, 24svh, 330px); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-weight: 700; }
  .facts li { display: flex; align-items: center; gap: 8px; }
  .facts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .kidnote { color: var(--haze); max-width: 40ch; }
  .go {
    width: 100%; min-height: 3.6rem; border: 0; border-radius: var(--r);
    background: var(--gold); color: var(--on-gold);
    font: 800 1.15rem/1 var(--body); letter-spacing: 0.01em;
    box-shadow: 0 12px 28px -14px rgba(176, 141, 87, 0.65);
    transition: transform 0.15s ease-out, background-color 0.15s ease-out;
  }
  .go:active { transform: translateY(1px) scale(0.99); }
  @media (hover: hover) { .go:hover { background: var(--gold-hi); } }
  .quiet { background: none; border: 0; color: var(--mist); font-weight: 600; padding: 12px 4px; text-decoration: underline; text-underline-offset: 4px; }
  .actions { display: grid; gap: 4px; position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 1; }

  /* ───────── Pantalla de pregunta ───────── */
  .q { flex: 1; display: flex; flex-direction: column; }
  .band { background: var(--night); border-bottom: 1px solid var(--slate); }
  .band .topbar { padding-top: 8px; }
  .band .tool { border-color: #6B7894; } /* 3.6:1 sobre la franja: el borde de --edge no llega a 3:1 ahí */
  .band-track { position: relative; height: 46px; }
  .band-track canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .band-cap { display: flex; justify-content: space-between; gap: 12px; padding-block: 2px 12px; font-size: 1rem; color: var(--haze); }
  .band-cap b { color: var(--mist); font-weight: 700; }
  .qbody { display: grid; gap: 14px; padding-block: 28px 12px; }
  .q-title { font: 700 clamp(1.5rem, 6.2vw, 2.05rem)/1.18 var(--body); letter-spacing: -0.015em; text-wrap: balance; outline: none; }
  .q-help { color: var(--haze); max-width: 42ch; }
  .opts { display: grid; gap: 10px; margin-top: 8px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 3.75rem; padding: 14px 16px;
    text-align: left; font-size: 1.0625rem; line-height: 1.3; font-weight: 500;
    background: var(--night); color: var(--mist); border: 1.5px solid var(--edge); border-radius: var(--r);
    transition: background-color 0.18s ease-out, border-color 0.18s ease-out, color 0.18s ease-out;
  }
  .opt .lbl { min-width: 0; flex: 1; }
  .opt .ind { flex: none; width: 24px; height: 24px; border: 2px solid var(--haze); display: grid; place-items: center; transition: inherit; }
  .opt[role="radio"] .ind { border-radius: 50%; }
  .opt[role="checkbox"] .ind { border-radius: 7px; }
  .opt .ind svg { width: 16px; height: 16px; opacity: 0; color: var(--gold); }
  .opt[aria-checked="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 700; }
  .opt[aria-checked="true"] .ind { border-color: var(--on-gold); background: var(--on-gold); }
  .opt[role="radio"][aria-checked="true"] .ind { box-shadow: inset 0 0 0 5px var(--on-gold); background: var(--gold); }
  .opt[role="checkbox"][aria-checked="true"] .ind svg { opacity: 1; }
  .opt[aria-disabled="true"] { opacity: 0.42; }
  @media (hover: hover) { .opt:not([aria-checked="true"]):not([aria-disabled="true"]):hover, .tile:not([aria-checked="true"]):not([aria-disabled="true"]):hover { border-color: var(--gold); } }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
  .tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 8.5rem; padding: 16px 10px; text-align: center;
    background: var(--night); color: var(--mist); border: 1.5px solid var(--edge); border-radius: 20px;
    font-weight: 700; font-size: 1.0625rem; line-height: 1.2;
    transition: background-color 0.18s ease-out, border-color 0.18s ease-out, color 0.18s ease-out;
  }
  .tile svg { width: 44px; height: 44px; color: var(--gold); transition: color 0.18s ease-out; }
  .tile[aria-checked="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .tile[aria-checked="true"] svg { color: var(--on-gold); }
  .tile[aria-disabled="true"] { opacity: 0.42; }

  .textarea {
    width: 100%; min-height: 9rem; padding: 14px 16px; border-radius: var(--r);
    border: 1.5px solid var(--edge); background: var(--night); color: var(--mist);
    font-size: 1.0625rem; line-height: 1.45; resize: vertical;
  }
  .textarea::placeholder { color: var(--haze); opacity: 0.8; }
  .textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(176, 141, 87, 0.3); }
  .count { justify-self: end; font-size: 1rem; color: var(--haze); font-variant-numeric: tabular-nums; }
  .hint { color: var(--gold-hi); min-height: 1.4em; font-weight: 600; }

  .dock {
    position: sticky; bottom: 0; margin-top: auto;
    padding-block: 18px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, rgba(11, 15, 26, 0), var(--ink) 28%);
  }
  .next {
    width: 100%; min-height: 3.6rem; border-radius: var(--r); border: 0;
    background: var(--gold); color: var(--on-gold);
    font: 800 1.15rem/1 var(--body);
    box-shadow: 0 12px 28px -16px rgba(176, 141, 87, 0.7);
  }
  .next[aria-disabled="true"] { background: var(--slate); color: var(--haze); box-shadow: none; cursor: not-allowed; }

  /* ───────── Después de la meta ───────── */
  .after { display: grid; gap: 30px; padding-block: 30px 44px; }
  .after h2 { font: 800 2.1rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
  .after h3 { font: 700 1.3rem/1.2 var(--body); text-wrap: balance; }
  .after p { max-width: 42ch; }
  .muted { color: var(--haze); }
  .send { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r); background: var(--night); border: 1px solid var(--slate); }
  .send .dot { flex: none; width: 12px; height: 12px; margin-top: 6px; border-radius: 50%; background: var(--haze); }
  .send[data-s="ok"] .dot { background: var(--ok); }
  .send[data-s="sending"] .dot { background: var(--gold); animation: blink 1s ease-in-out infinite; }
  .send[data-s="offline"] .dot, .send[data-s="error"] .dot { background: var(--bad); }
  .send .msg { display: grid; gap: 8px; }
  .ticks { display: grid; gap: 12px; }
  .ticks li { display: flex; gap: 12px; align-items: flex-start; }
  .ticks svg { flex: none; width: 22px; height: 22px; color: var(--gold); margin-top: 2px; }
  .share-row { display: grid; gap: 10px; }
  .ghost {
    width: 100%; min-height: 3.3rem; border-radius: var(--r); border: 1.5px solid var(--edge);
    background: transparent; color: var(--mist); font: 700 1.05rem/1 var(--body);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
  }
  .ghost svg { width: 20px; height: 20px; }
  .go.as-link { display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
  .go svg { width: 22px; height: 22px; }
  .share-text { width: 100%; min-height: 6rem; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--edge); background: var(--night); color: var(--mist); font-size: 1rem; line-height: 1.4; resize: none; }
  details.raw { border-top: 1px solid var(--slate); padding-top: 16px; }
  details.raw summary { cursor: pointer; font-weight: 700; color: var(--haze); }
  details.raw pre { margin: 12px 0 0; padding: 14px; border-radius: 12px; background: var(--night); border: 1px solid var(--slate); overflow-x: auto; font: 0.8rem/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .link { background: none; border: 0; padding: 10px 0; color: var(--mist); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; justify-self: start; }

  .promise { font-weight: 600; color: var(--mist); max-width: 40ch; }
  .promise b { color: var(--gold-hi); font-weight: 700; }
  .cheer { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgba(176, 141, 87, 0.14); border: 1px solid rgba(176, 141, 87, 0.45); animation: cheerIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .cheer svg { flex: none; width: 26px; height: 26px; color: var(--gold); }
  .cheer b { color: var(--gold-hi); }
  .medal { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px 20px; border-radius: 20px; background: var(--night); border: 1px solid var(--slate); }
  .medal svg { width: 150px; height: auto; display: block; }
  .medal .stack { justify-items: center; }
  .medal p { margin-inline: auto; }
  .medal h2 { font-size: 1.7rem; }
  @keyframes cheerIn { from { opacity: 0.4; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .cheer { animation: none; } }
  .enter { animation: settle 0.42s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes settle { from { opacity: 0.35; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .enter, .send .dot { animation: none !important; } .go, .opt, .tile { transition: none; } }
  @media (min-width: 720px) { .wrap { max-width: 38rem; } }
</style>

  // ───────── Avance: se guarda hasta dónde llegó cada persona, aunque no termine ─────────

  // ───────── Corredores (pictogramas en canvas) ─────────
  const TAU = Math.PI * 2;

  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const POSE = {
    run:    { legAmp: 0.72, flexB: 0.15, flexA: 1.3,  armAmp: 0.75, elbow: 1.5,  lean: 0.18, bob: 0.035, head: 0.105 },
    kid:    { legAmp: 0.74, flexB: 0.15, flexA: 1.25, armAmp: 0.8,  elbow: 1.45, lean: 0.14, bob: 0.04,  head: 0.135 },
    senior: { legAmp: 0.3,  flexB: 0.05, flexA: 0.25, armAmp: 0.12, elbow: 0.2,  lean: 0.3,  bob: 0.006, head: 0.105 }
  };
  function drawRunner(ctx, x, ground, h, p, kind, color) {
    const cheer = kind === 'cheer', P = POSE[cheer ? 'run' : kind];

    const lean = cheer ? 0.02 : P.lean;

    const hx = x, hy = ground - (TH + SH) * 0.95 - bob;
    const sx = hx + Math.sin(lean) * T, sy = hy - Math.cos(lean) * T;

  const LANES = [

    ['run', 'kid'],
    ['senior', 'kid', 'run'],
    ['you', 'run']

    run: { speed: 0.95, stride: 1.15, scale: 1 },

    senior: { speed: 0.3, stride: 0.6, scale: 0.97 }

  class TrackScene {
    constructor(section, opts) {
      this.section = section; this.opts = opts || {};

      this.spacer = section.querySelector('.track-space');
      this.runners = null; this.lastDraw = 0; this.raf = 0; this.visible = true; this.pulse = 0;

      const dpr = Math.min(1.5, window.devicePixelRatio || 1);

      this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(hgt * dpr);

    }

        const depth = 0.7 + li * 0.08, list = [];
        for (let r = 0; r < reps; r++) kinds.forEach((k) => { if (k !== 'you' || r === 0) list.push(k); });
        list.forEach((k, j) => {
          const K = KIND[k], h = this.unit * depth * K.scale, v = K.speed * h * 0.95;
          const m = { lane: li, kind: k, h, x: (j + 0.15 + rand() * 0.55) * (this.W / list.length), p: rand() * TAU, v, cad: v / (K.stride * h) * TAU };

      });

        c.beginPath(); c.moveTo(this.fx, y0); c.lineTo(this.fx, y1); c.stroke();
        c.fillStyle = GOLD; c.font = '900 17px ' + DISPLAY_FONT;
        c.textAlign = 'center'; c.fillText('META', this.fx, y0 - 8); c.textAlign = 'start';
      }

        const you = m.kind === 'you';
        drawRunner(c, m.x, this.base[m.lane], m.h, m.p, you ? (m.done ? 'cheer' : 'run') : m.kind, you ? GOLD : tintOf(0.22 + m.lane * 0.07));
      }

  }

  class BandScene {
    constructor(holder, target, from, marks) {
      this.holder = holder; this.canvas = holder.querySelector('canvas'); this.ctx = this.canvas.getContext('2d');

  // ───────── Motivación: tiempo que falta, puestos de abastecimiento y medalla de finalista ─────────
  const SECS_PER_Q = 11;
  function timeLeft() {
    const { path } = walk();
    const left = path.length - Math.max(0, path.indexOf(state.current));
    if (left <= 1) return 'Última pregunta';
    return 'Faltan ~' + Math.max(1, Math.round((left * SECS_PER_Q) / 60)) + ' min';
  }
  const CHEERS = {
    quarter: ['Buen ritmo.', 'Ya llevas un cuarto del recorrido.'],
    half: ['Mitad del recorrido.', 'En la meta te contamos para qué es todo esto.'],
    last: ['Último tramo.', 'Ya casi cruzas la meta y te llevas tu medalla.']
  };
  // Se llama al llegar a una pregunta nueva: deja un mensaje si cruzó un hito que aún no había visto
  function checkMilestone() {
    state.cheer = null;
    if (Q[state.current].type === 'info') return;
    const { path } = walk();
    const i = Math.max(0, path.indexOf(state.current)), left = path.length - i, p = i / path.length;
    const seen = (k) => state.milestones.includes(k);
    let k = null;
    if (left <= 3 && path.length > 8 && !seen('last')) k = 'last';
    else if (p >= 0.5 && !seen('half')) k = 'half';
    else if (p >= 0.25 && p < 0.5 && !seen('quarter')) k = 'quarter';
    if (!k) return;
    state.milestones.push(k);
    state.cheer = k;
    setTimeout(() => announce(CHEERS[k].join(' ')), 400);
  }
  function cheerBox() {
    if (!state.cheer) return '';
    const c = CHEERS[state.cheer];
    return '<div class="cheer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15" cy="4.5" r="2.3" fill="currentColor"/><path d="M13 8.5l-3 4.5 3.5 2.5-1.5 5.5M10 13l-4 1M13.5 9.5l4 2 2-2.5M16 15.5l3 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>' + c[0] + '</b> ' + c[1] + '</p></div>';
  }

  // Número de llegada: se pide recién cuando la respuesta final quedó guardada en la base
  async function completeProgress(item) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/save_survey_progress', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          p_client_id: item.client_id, p_version: item.version, p_path: item.path, p_channel: item.channel,
          p_last_question: item.path === 'ninez' ? 'END_KIDS' : 'END', p_answers: item.answers, p_completed: true, p_seq: nextSeq()
        })
      });
      if (!res.ok) return;
      const n = await res.json();
      if (state.final && item.client_id === state.final.client_id) { state.finisherNo = typeof n === 'number' ? n : null; updateMedal(); }
    } catch (e) {}
  }

  function medalSVG(label, small) {
    return '<svg viewBox="0 0 200 250" role="img" aria-label="Medalla de finalista' + (label ? ' ' + label : '') + '">' +
      '<polygon points="56,0 92,0 114,124 78,124" fill="#2E3A4F"/>' +
      '<polygon points="144,0 108,0 86,124 122,124" fill="#56647E"/>' +
      '<circle cx="100" cy="170" r="74" fill="#B08D57"/>' +
      '<circle cx="100" cy="170" r="61" fill="none" stroke="#8C6E40" stroke-width="4"/>' +
      '<text x="100" y="' + (label ? 186 : 182) + '" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="' + (label ? (label.length > 4 ? 40 : 50) : 34) + '" fill="#0B0F1A">' + (label || 'META') + '</text>' +
      '<text x="100" y="' + (label ? 208 : 204) + '" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="800" font-size="11" letter-spacing="2" fill="#0B0F1A">FINALISTA</text>' +
      '</svg>';
  }
  function medalText() {
    const n = state.finisherNo;
    if (typeof n === 'number') return 'Eres la persona número ' + n + ' en cruzar la meta.';
    if (state.channel === 'prueba') return 'Medalla de prueba: las pruebas del equipo no reciben número.';
    if (n === undefined && state.send === 'sending') return 'Calculando tu número de llegada…';
    return 'Tu número de llegada aparece cuando tus respuestas lleguen.';
  }
  function medalBox() {
    const n = state.finisherNo;
    return '<div class="medal" id="medal">' + medalSVG(typeof n === 'number' ? '#' + n : '') +
      '<div class="stack"><h2>Tu medalla de finalista</h2><p id="medal-text">' + medalText() + '</p>' +
      '<button type="button" class="go" data-act="medal">Guardar para historias</button>' +
      '<p class="muted">Se guarda como imagen para subirla a tus historias de Instagram.</p></div></div>';
  }
  function updateMedal() {
    const el = document.getElementById('medal');
    if (el) el.outerHTML = medalBox();
    if (typeof state.finisherNo === 'number') announce('Eres la persona número ' + state.finisherNo + ' en cruzar la meta.');
  }

  // Imagen 1080 × 1920 para historias, con espacio para el sticker de enlace
  async function makeStoryCanvas(n, kids) {
    for (const f of ['900 200px "Big Shoulders Display"', '800 46px "Big Shoulders Display"', '600 44px Figtree', '700 44px Figtree']) { try { await document.fonts.load(f); } catch (e) {} }
    const W = 1080, H = 1920, L = 72, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const x = cv.getContext('2d');
    x.fillStyle = '#0B0F1A'; x.fillRect(0, 0, W, H);
    x.textBaseline = 'alphabetic';
    x.letterSpacing = '5px'; x.font = '800 46px "Big Shoulders Display"';
    x.fillStyle = '#D9DCE3'; x.fillText('CORRER EN', L, 262); const w0 = x.measureText('CORRER EN ').width;
    x.fillStyle = '#B08D57'; x.fillText('NICARAGUA', L + w0, 262);
    const l1 = kids ? 'LLEGAMOS' : 'LLEGUÉ';
    x.letterSpacing = '2px'; let size = 210; x.font = '900 ' + size + 'px "Big Shoulders Display"';
    const widest = Math.max(x.measureText(l1).width, x.measureText('A LA META').width);
    size = Math.min(210, Math.floor(size * Math.min(1, (W - 2 * L) / widest))); x.font = '900 ' + size + 'px "Big Shoulders Display"';
    const b1 = 262 + 40 + Math.round(size * 0.97), b2 = b1 + size;
    x.fillStyle = '#D9DCE3'; x.fillText(l1, L - 4, b1); x.fillText('A LA ', L - 4, b2);
    x.fillStyle = '#B08D57'; x.fillText('META', L - 4 + x.measureText('A LA ').width, b2);
    // medalla
    const cx = W / 2, top = b2 + 56, r = 170, cy = top + 190 + r * 0.55, k = r / 196;
    x.fillStyle = '#2E3A4F'; x.beginPath(); x.moveTo(cx - 172 * k, top); x.lineTo(cx - 34 * k, top); x.lineTo(cx + 46 * k, cy - r * 0.62); x.lineTo(cx - 92 * k, cy - r * 0.62); x.closePath(); x.fill();
    x.fillStyle = '#56647E'; x.beginPath(); x.moveTo(cx + 172 * k, top); x.lineTo(cx + 34 * k, top); x.lineTo(cx - 46 * k, cy - r * 0.62); x.lineTo(cx + 92 * k, cy - r * 0.62); x.closePath(); x.fill();
    x.fillStyle = '#B08D57'; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#8C6E40'; x.lineWidth = 10; x.beginPath(); x.arc(cx, cy, r * 0.83, 0, Math.PI * 2); x.stroke();
    x.textAlign = 'center'; x.fillStyle = '#0B0F1A'; x.letterSpacing = '0px';
    const label = typeof n === 'number' ? '#' + n : 'META';
    x.font = '900 ' + (label.length > 4 ? 104 : 130) + 'px "Big Shoulders Display"'; x.fillText(label, cx, cy + 40);
    x.letterSpacing = '6px'; x.font = '800 26px Figtree'; x.fillText('FINALISTA', cx, cy + 90);
    // textos
    x.letterSpacing = '0px';
    x.font = '700 46px Figtree'; x.fillStyle = '#D9DCE3';
    x.fillText(kids ? 'Terminamos la encuesta' : 'Terminé la encuesta', cx, cy + r + 76);
    x.font = '600 40px Figtree'; x.fillStyle = '#A6ADBD';
    x.fillText('Correr en Nicaragua · 2026', cx, cy + r + 128);
    const yCall = cy + r + 214; // con el titular a 210 px queda en ~1430: el recuadro termina antes de la barra de respuesta
    x.font = '600 44px Figtree'; x.fillStyle = '#D9DCE3'; x.fillText('¿Y tú? Cuéntanos cómo corres', cx, yCall);
    const bw = 820, bh = 118, bx = (W - bw) / 2, by = yCall + 28;
    x.setLineDash([16, 12]); x.lineWidth = 4; x.strokeStyle = '#B08D57';
    x.beginPath(); x.roundRect(bx, by, bw, bh, 59); x.stroke(); x.setLineDash([]);
    x.font = '700 44px Figtree'; x.fillStyle = '#B08D57'; x.fillText('corrernicaragua.github.io', cx, by + bh / 2 + 15);
    x.textAlign = 'start';
    return cv;
  }
  async function saveMedal(btn) {
    const old = btn.textContent; btn.textContent = 'Preparando tu medalla…';
    try {
      const cv = await makeStoryCanvas(state.finisherNo, state.view === 'doneKids');
      const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
      const file = new File([blob], 'medalla-correr-en-nicaragua.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Mi medalla de finalista', text: inviteText() }).catch(() => {});
      } else {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      announce('Tu medalla está lista para tus historias.');
    } catch (e) { announce('No se pudo preparar la imagen. Intenta de nuevo.'); }
    btn.textContent = old;
  }
  if (channelFrom() === 'prueba') window.__medalla = async (n, kids) => (await makeStoryCanvas(n, kids)).toDataURL('image/png');

  // ───────── Vistas ─────────
  let scenes = [];
  let lastProgress = 0;
  const app = document.getElementById('app');

  function topbar(withBack) {
    const mark = '<span class="wordmark">Correr en <b>Nicaragua</b></span>';
    return '<div class="topbar wrap">' +
      (withBack ? '<button type="button" class="tool" data-act="back" aria-label="Pregunta anterior">' + BACK + '</button>' + mark : mark) +
      '<button type="button" class="tool" data-act="big" aria-pressed="' + state.big + '" aria-label="Letra grande">Aa</button></div>';
  }

  function viewWelcome() {
    const resume = hasDraft();
    return '<section class="field enter" data-scene="track"><canvas class="scene" aria-hidden="true"></canvas>' +
      '<div class="field-inner">' + topbar(false) +
      '<div class="wrap stack"><h1 class="headline">Cuéntanos cómo <em>corres</em></h1>' +
      '<p class="lede">O cómo caminas, o cómo acompañas.</p></div>' +
      '<div class="track-space" aria-hidden="true"></div>' +
      '<div class="wrap stack">' +
        '<ul class="facts"><li>3 a 8 minutos</li><li>Anónima</li></ul>' +
        '<p class="promise">En la meta te contamos para qué es todo esto <b>y te llevas tu medalla de finalista.</b></p>' +
        '<p class="kidnote">¿Tienes menos de 13 años? Contéstala junto a tu mamá, tu papá o la persona adulta que te cuida.</p>' +
        '<p class="kidnote">Tus respuestas se guardan a medida que avanzas, sin nada que te identifique.</p>' +
        '<div class="actions">' +
          (resume
            ? '<button type="button" class="go" data-act="resume">Seguir donde quedaste</button><button type="button" class="quiet" data-act="restart">Empezar de nuevo</button>'
            : '<button type="button" class="go" data-act="start">Empezar</button>') +
        '</div>' +
      '</div></div></section>';
  }

  function viewInfo(id) {
    const q = Q[id];
    return '<section class="field enter" data-scene="track"><canvas class="scene" aria-hidden="true"></canvas>' +
      '<div class="field-inner">' + topbar(true) +
      '<div class="wrap stack"><h1 class="headline small" tabindex="-1" id="qt">' + q.title + '</h1>' +
      '<p class="lede">' + q.help + '</p></div>' +
      '<div class="track-space" aria-hidden="true"></div>' +
      '<div class="wrap actions"><button type="button" class="go" data-act="next">' + (q.cta || 'Seguir') + '</button></div>' +
      '</div></section>';
  }

  function optionsHTML(q, a) {
    const multi = q.type === 'multi';
    const sel = multi ? (a || []) : [a];
    const full = multi && q.max && sel.length >= q.max;
    const role = multi ? 'checkbox' : 'radio';
    const group = multi ? 'role="group"' : 'role="radiogroup"';
    if (q.tiles) {
      return '<div class="tiles" ' + group + ' aria-labelledby="qt">' + q.options.map((op) => {
        const on = sel.includes(op.v), off = full && !on && !op.ex;
        return '<button type="button" class="tile" role="' + role + '" aria-checked="' + on + '"' + (off ? ' aria-disabled="true"' : '') + ' data-v="' + op.v + '">' + svgIcon(op.i) + '<span>' + op.t + '</span></button>';
      }).join('') + '</div>';
    }
    return '<div class="opts" ' + group + ' aria-labelledby="qt">' + q.options.map((op) => {
      const on = sel.includes(op.v), off = full && !on && !op.ex;
      return '<button type="button" class="opt" role="' + role + '" aria-checked="' + on + '"' + (off ? ' aria-disabled="true"' : '') + ' data-v="' + op.v + '">' +
        '<span class="ind">' + (multi ? CHECK : '') + '</span><span class="lbl">' + op.t + '</span></button>';
    }).join('') + '</div>';
  }

  function nextLabel(id) {
    const nx = nextOf(id, state.answers[id]);
    return nx && String(nx).startsWith('END') ? 'Terminar' : 'Siguiente';
  }

  function viewQuestion(id) {
    const q = Q[id], a = state.answers[id];
    const answered = isAnswered(q, a);
    const body = q.type === 'text'
      ? '<label class="sr" for="ta">' + esc(q.title) + '</label><textarea class="textarea" id="ta" maxlength="600" placeholder="Escribe aquí…">' + esc(a || '') + '</textarea><span class="count" id="count">' + String((a || '').length) + ' de 600</span>'
      : optionsHTML(q, a);
    return '<section class="q enter">' +
      '<header class="band">' + topbar(true) +
        '<div class="wrap"><div class="band-track"><canvas aria-hidden="true"></canvas></div>' +
        '<div class="band-cap"><b>' + BLOCK[q.b] + '</b><span>' + timeLeft() + '</span></div></div>' +
      '</header>' +
      '<div class="wrap qbody">' +
        cheerBox() +
        '<h1 class="q-title" tabindex="-1" id="qt">' + q.title + '</h1>' +
        (q.help ? '<p class="q-help">' + q.help + '</p>' : '') +
        body +
        '<p class="hint" id="hint">' + esc(state.hint) + '</p>' +
      '</div>' +
      '<div class="dock"><div class="wrap"><button type="button" class="next" data-act="next"' + (answered ? '' : ' aria-disabled="true"') + '>' + nextLabel(id) + '</button></div></div>' +
      '</section>';
  }

  function finalAnswers() {
    const { path, end } = walk();
    const out = {};
    path.forEach((id) => { const q = Q[id]; if (q.type !== 'info' && isAnswered(q, state.answers[id])) out[id] = q.type === 'text' ? String(state.answers[id]).trim().slice(0, 600) : state.answers[id]; });
    return { version: VERSION, path: end === 'END_KIDS' ? 'ninez' : 'general', channel: state.channel, answers: out, client_id: state.clientId || uuid() };
  }
  const shareURL = () => PUBLIC_URL + '?c=compartido';
  const inviteText = () => 'Te paso esta encuesta sobre cómo se vive el correr en Nicaragua. Es anónima, toma unos minutos y tu historia cuenta aunque no corras: ' + shareURL();

  function viewDone(kids) {
    const hero = '<section class="field enter" data-scene="finish"><canvas class="scene" aria-hidden="true"></canvas>' +
      '<div class="field-inner">' + topbar(false) +
      '<div class="wrap stack"><h1 class="headline" tabindex="-1" id="qt">' + (kids ? 'Llegamos a la <em>meta</em>' : 'Llegaste a la <em>meta</em>') + '</h1>' +
      '<p class="lede">' + (kids ? 'Gracias a los dos. Lo que nos contaron ayuda a pensar carreras donde las niñas y los niños también la pasen bien.' : 'Gracias. Tu historia ya cuenta para entender cómo se corre en Nicaragua.') + '</p></div>' +
      '<div class="track-space" aria-hidden="true"></div></div></section>';
    const reveal = kids ? '' : '<div class="stack"><h2>Lo que estamos construyendo</h2>' +
      '<p>Ahora que terminaste te lo contamos: una app para correr en Nicaragua. Todavía no tiene nombre.</p>' +
      '<ul class="ticks">' +
        '<li>' + CHECK + '<span>Inscripción y pago en un solo lugar, sin WhatsApp de por medio.</span></li>' +
        '<li>' + CHECK + '<span>Tu dorsal en el teléfono, aunque no tengas señal.</span></li>' +
        '<li>' + CHECK + '<span>Crews por zona y un reto cada semana.</span></li>' +
      '</ul></div>';
    const again = kids
      ? '<div class="stack"><h3>¿Tú también corres o caminas?</h3><p class="muted">Contesta la encuesta otra vez, ahora sobre ti.</p><button type="button" class="ghost" data-act="restart">Contestar sobre mí</button></div>'
      : '';
    const canShare = !!navigator.share;
    const share = '<div class="stack"><h3>Pásala a alguien de tu familia que no corra</h3><p class="muted">Su historia también cuenta, aunque nunca haya corrido una carrera.</p>' +
      '<div class="share-row">' +
        '<a class="go as-link" href="https://wa.me/?text=' + encodeURIComponent(inviteText()) + '" target="_blank" rel="noopener">' + CHAT_ICON + 'Enviar por WhatsApp</a>' +
        (canShare ? '<button type="button" class="ghost" data-act="share">' + SHARE_ICON + 'Otras formas de compartir</button>' : '') +
        '<button type="button" class="ghost" data-act="copy">' + LINK_ICON + 'Copiar enlace</button>' +
      '</div>' +
      (state.shareFallback ? '<label class="sr" for="share-text">Invitación para copiar</label><textarea class="share-text" id="share-text" readonly>' + esc(inviteText()) + '</textarea><p class="muted">Mantén presionado el texto para copiarlo.</p>' : '') +
      '</div>';
    const raw = state.channel === 'prueba'
      ? '<details class="raw"><summary>Lo que se envió (solo en modo prueba)</summary><pre>' + esc(JSON.stringify(state.final, null, 2)) + '</pre></details>'
      : '';
    return hero + '<div class="wrap after">' + medalBox() + sendBox() + reveal + again + share + raw + '</div>';
  }

  function render(dir) {
    scenes.forEach((s) => s.destroy()); scenes = [];
    document.documentElement.classList.toggle('big', state.big);
    let html;
    if (state.view === 'welcome') html = viewWelcome();
    else if (state.view === 'done') html = viewDone(false);
    else if (state.view === 'doneKids') html = viewDone(true);
    else html = Q[state.current].type === 'info' ? viewInfo(state.current) : viewQuestion(state.current);
    app.innerHTML = html;
    if (dir === 'same') app.querySelectorAll('.enter').forEach((el) => el.classList.remove('enter'));
    app.querySelectorAll('[data-scene]').forEach((sec) => scenes.push(new TrackScene(sec, { finish: sec.dataset.scene === 'finish' })));
    const band = app.querySelector('.band-track');
    if (band) {
      const { p, path } = progress();
      const marks = []; let prevB = null;
      path.forEach((id, i) => { if (Q[id].b !== prevB) { marks.push(i / path.length); prevB = Q[id].b; } });
      scenes.push(new BandScene(band, p, dir === 'same' ? p : lastProgress, marks));
      lastProgress = p;
    } else if (state.view === 'welcome') lastProgress = 0;
    const title = app.querySelector('#qt');
    if (title && dir !== 'same') title.focus({ preventScroll: true });
    save();
  }

  // ───────── Acciones ─────────
  function say(msg) { state.hint = msg; render('same'); announce(msg); }
  function pushHistory(id) { if (state.history[state.history.length - 1] !== id) state.history.push(id); }
  function goNext() {
    if (state.view !== 'q') return;
    const q = Q[state.current], a = state.answers[state.current];
    if (q.type !== 'info' && !isAnswered(q, a)) {
      say(q.type === 'text' ? 'Escribe al menos una palabra para seguir. Si no hubo nada, escribe «nada».' : 'Elige una opción para seguir. Si no te acuerdas, elige «No me acuerdo».');
      return;
    }
    const nx = nextOf(state.current, a);
    state.hint = '';
    pushHistory(state.current);
    if (nx === 'END' || nx === 'END_KIDS') {
      state.final = finalAnswers();
      state.finisherNo = undefined; state.cheer = null;
      writeQueue(readQueue().filter((i) => i.client_id !== state.final.client_id).concat([state.final]));
      state.send = 'sending';
      state.view = nx === 'END' ? 'done' : 'doneKids';
      render(); window.scrollTo(0, 0); announce('Llegaste a la meta.');
      flush();
      return;
    }
    state.current = nx; checkMilestone(); render(); window.scrollTo(0, 0);
    sendProgress();
  }
  function goBack() {
    state.hint = '';
    if (state.view === 'done' || state.view === 'doneKids') { state.view = 'welcome'; render(); return; }
    if (state.history.length) { state.current = state.history.pop(); render(); window.scrollTo(0, 0); }
    else { state.view = 'welcome'; render(); }
  }
  function restart() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    Object.assign(state, { answers: {}, history: [], current: 'P1', hint: '', final: null, send: 'idle', shareFallback: false, view: 'q', clientId: uuid(), milestones: [], cheer: null, finisherNo: undefined });
    lastProgress = 0; render(); window.scrollTo(0, 0); sendProgress();
  }
  function pick(v) {
    const id = state.current, q = Q[id];
    if (q.type === 'single') { state.answers[id] = v; state.hint = ''; render('same'); return; }
    const cur = (state.answers[id] || []).slice();
    const op = q.options.find((x) => x.v === v);
    let next;
    if (cur.includes(v)) next = cur.filter((x) => x !== v);
    else if (op.ex) next = [v];
    else {
      next = cur.filter((x) => !(q.options.find((y) => y.v === x) || {}).ex);
      if (q.max && next.length >= q.max) { say('Puedes elegir hasta ' + q.max + '. Quita una para cambiarla.'); return; }
      next.push(v);
    }
    state.hint = '';
    if (next.length) state.answers[id] = next; else delete state.answers[id];
    render('same');
  }

  app.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.dataset.v) {
      const v = b.dataset.v;
      if (b.getAttribute('aria-disabled') === 'true') say('Puedes elegir hasta ' + Q[state.current].max + '. Quita una para cambiarla.');
      else pick(v);
      const again = app.querySelector('[data-v="' + v + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (act === 'start') { state.view = 'q'; state.current = 'P1'; state.clientId = uuid(); state.milestones = []; state.cheer = null; render(); window.scrollTo(0, 0); sendProgress(); }
    else if (act === 'resume') { state.view = 'q'; if (!state.clientId) state.clientId = uuid(); render(); sendProgress(); }
    else if (act === 'restart') restart();
    else if (act === 'next') goNext();
    else if (act === 'back') goBack();
    else if (act === 'medal') saveMedal(b);
    else if (act === 'retry') { setSend('sending'); flush(); }
    else if (act === 'big') { state.big = !state.big; render('same'); const t = app.querySelector('[data-act="big"]'); if (t) t.focus({ preventScroll: true }); announce(state.big ? 'Letra grande activada.' : 'Letra normal.'); }
    else if (act === 'share') { navigator.share({ title: 'Correr en Nicaragua', text: inviteText(), url: shareURL() }).catch(() => {}); }
    else if (act === 'copy') {
      const ok = () => { b.lastChild.textContent = 'Enlace copiado'; announce('Enlace copiado. Pégalo en WhatsApp o donde quieras.'); };
      const fail = () => {
        state.shareFallback = true; render('same');
        const ta = document.getElementById('share-text');
        if (ta) { ta.focus({ preventScroll: true }); ta.select(); ta.scrollIntoView({ block: 'center' }); }
        announce('No se pudo copiar solo. El texto quedó seleccionado para que lo copies.');
      };
      try { navigator.clipboard.writeText(inviteText()).then(ok, fail); } catch (err) { fail(); }
    }
  });
  app.addEventListener('input', (e) => {
    if (e.target.id !== 'ta') return;
    const v = e.target.value; if (v.trim()) state.answers[state.current] = v; else delete state.answers[state.current];
    const c = document.getElementById('count'); if (c) c.textContent = v.length + ' de 600';
    const btn = app.querySelector('.dock [data-act="next"]');
    if (btn) { if (isAnswered(Q[state.current], v)) btn.removeAttribute('aria-disabled'); else btn.setAttribute('aria-disabled', 'true'); }
    save();
  });
  window.addEventListener('online', () => flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state.view === 'q') sendProgress(null, false, true); });

  load();
  render();
  flush(); // envía respuestas que quedaron pendientes en este teléfono
})();
</script>
